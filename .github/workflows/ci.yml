name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Unit/widget tests and the analyzer are platform-independent, so they run
  # on a Linux runner - only the iOS jobs below need a Mac.
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Formatting is enforced rather than suggested: the repo is
      # dart-format clean as of the format-everything commit, so any
      # deviation from here is a deliberate fight with the formatter.
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test

  ios-build:
    # Proves the Dart and plugin code actually compiles for iOS - the only
    # platform this app targets. --no-codesign needs no signing identity or
    # provisioning profile, just a Mac runner and no Apple account.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

  ios-simulator:
    # A clean compile says nothing about whether the app launches. This boots
    # a real iOS Simulator (Apple's own preinstalled runtimes - no Apple ID or
    # Developer Program needed) and drives the app on it: deck loads off the
    # bundle, the ring opens the study card, Next pages, "learned" writes
    # through a real SharedPreferences channel. Runs only after ios-build,
    # since booting a simulator for code that doesn't compile is wasted time.
    needs: ios-build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get

      - name: Boot iOS Simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F-]{36}')
          echo "Booting simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - run: flutter test integration_test/app_test.dart -d "$UDID"

      - name: Screenshot the running app
        # Best-effort: the run above is the actual gate. This just leaves a
        # picture of the last frame behind as a build artifact.
        if: always()
        run: xcrun simctl io "$UDID" screenshot simulator.png || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-screenshot
          path: simulator.png
          if-no-files-found: ignore

  decks-are-valid:
    # Checks the generated decks against the invariants the app relies on:
    # every level present and full-size, ids unique, readings kana, orders
    # sequential. Deliberately NOT a regenerate-and-diff: the decks come
    # from upstream word lists, so a byte comparison would fail whenever
    # someone else fixes a typo in a list - which says nothing about this
    # repo, and would need network access in CI to find out.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/verify_assets.py
