name: kotoba_lantern
description: "Kotoba Lantern - a quiet daily Japanese (JLPT N5) vocabulary deck."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_tts: ^4.2.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/jlpt_n5.json
    - assets/data/jlpt_n4.json
    - assets/data/jlpt_n3.json
    - assets/data/jlpt_n2.json
    - assets/data/jlpt_n1.json
    - assets/data/sentences.json
    - assets/data/kanji_info.json
